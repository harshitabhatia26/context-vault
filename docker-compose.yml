services:

  postgres:
    image: postgres:16
    container_name: contextvault-postgres
    environment:
      POSTGRES_DB: contextvault
      POSTGRES_USER: contextuser
      POSTGRES_PASSWORD: contextpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data


  redis:
    image: redis:7
    container_name: contextvault-redis
    ports:
      - "6379:6379"


volumes:
  postgres_data: